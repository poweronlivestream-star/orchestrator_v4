name: V5 Orchestrator Pipeline
on:
  workflow_dispatch:
    inputs:
      folder_id:
        required: true
      drive_token:
        required: false
        default: ""
jobs:
  analyze_v5:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arabic Fonts & HarfBuzz (libraqm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-noto-core libraqm0 libfribidi0 libharfbuzz0b
          mkdir -p ./fonts
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" -o ./fonts/Cairo-Variable.ttf || true
      - name: Install Dependencies
        run: python -m pip install --upgrade pip requests google-genai google-auth yt-dlp pillow fonttools jsonschema
      - name: Install FFmpeg (Static)
        run: |
          curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
      - name: Run Master V7.0 Enterprise Engine
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          FOLDER_ID: ${{ inputs.folder_id }}
          DRIVE_TOKEN: ${{ inputs.drive_token }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GEMINI_FREE_API_KEYS: ${{ secrets.GEMINI_FREE_API_KEYS }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -u orchestrator_v5.py
      - name: Backup Reports as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-backup-${{ github.run_id }}
          path: ./backup_reports/
          if-no-files-found: ignore
          retention-days: 14
